name: CI

# Only a tag-triggered publish workflow existed, so no pull request in this
# repository had ever been checked.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in requires-python, and current.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The corpus is shared with the other receivers and pinned to a tag,
      # so a new expectation lands when this repository adopts it rather
      # than the next time CI happens to run.
      - name: Fetch the conformance corpus
        run: scripts/fetch-fixtures.sh

      - name: Test
        run: uv run --group dev --python ${{ matrix.python-version }} pytest -q
